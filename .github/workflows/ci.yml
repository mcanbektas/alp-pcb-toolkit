name: CI

# main'e push'ta ve her PR'da koşar. Eskiden `push` dalsızdı: PR açık bir
# dala itilen her commit hem push hem pull_request tetikleyicisiyle AYNI
# testleri iki kez koşuyordu. PR'sız yan dallar artık CI görmez — kural zaten
# PR üzerinden merge; doğrudan main push'u da (bu depoda olağan yol) kapsanır.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        # package.json depo kökünde DEĞİL, web/ altındadır (Faz 0 taşıması).
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Hesap motorları testten geçmeden ileri gidilmez.
      - run: npm test
      - run: npm run build

  api:
    name: api — test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore api/Alp.Api.sln
      - run: dotnet build api/Alp.Api.sln -c Release --no-restore
      # Sunucu kuralları (rapor önizlemesi, SVG kapısı, logo türü, ad tekliği,
      # sahiplik) testten geçmeden ileri gidilmez. Veritabanı servisi gerekmez:
      # testler bellek içi SQLite kurar, bkz. Alp.Api.Tests/TestHost.cs
      - run: dotnet test api/Alp.Api.sln -c Release --no-build --verbosity minimal
