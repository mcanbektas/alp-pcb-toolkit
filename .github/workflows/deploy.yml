name: İmaj derle ve yayınla

# GitHub Pages akışının yerini alır: uygulama artık kendi sunucumuza dağıtılır
# (CLAUDE.md → dağıtım bölümü, docs/uyelik-ve-rapor-plani.md §7).
#
# Bu iş akışı yalnızca imajları derleyip ghcr.io'ya iter. SUNUCUYA BAĞLANAN
# ADIM BİLEREK YOK: sunucu henüz yok, dolayısıyla depoda SSH sırrı da yok.
# Sunucu hazır olduğunda buraya bir `deploy` işi eklenir (adımlar
# deploy/README.md'de yazılı) ya da sunucuda `git pull` + compose kullanılır —
# iki yol da aynı compose dosyalarıyla çalışır.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # ghcr.io/<sahip>/<depo> — deploy/.env içindeki IMAGE_PREFIX ile aynı olmalı.
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # İmaj derlemeden önce ayrı bir kapı: web imajı testleri kendi içinde de
  # koşar (web/Dockerfile), api testleri de BURADA koşar. Eskiden yalnızca
  # `dotnet build` vardı — kırmızı xunit takımıyla `latest` imajı ghcr.io'ya
  # itilebiliyordu; ci.yml ayrı bir iş akışı olduğu için bunu engellemiyordu.
  test:
    name: Testler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet test api/Alp.Api.sln -c Release

  images:
    name: ${{ matrix.name }} imajı
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # api imajı web'in alan adı guard'ına takılıp iptal olmasın: ikisi
      # birbirinden bağımsız yayınlanır.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
          - name: web
            dockerfile: web/Dockerfile
    steps:
      - uses: actions/checkout@v4

      # VITE_SITE_URL DERLEME zamanı gömülür (web/Dockerfile:32) ve çalışma
      # zamanında değiştirilemez; üretim ise hazır imajı `--no-build` ile
      # çeker, yani deploy/.env'e yazılan değer bu imaja hiç ulaşmaz.
      # Değer yokken derleme, 106 sayfanın canonical/hreflang'ine ve
      # sitemap'e placeholder alan adı basar (web/scripts/site-url.mjs:13)
      # ve yalnızca uyarı verip yeşil kalır. Yayınlanmış böyle bir imaj
      # dağıtılamaz, o yüzden burada sessizce geçilmez.
      - name: Alan adı tanımlı mı (yalnız web)
        if: matrix.name == 'web' && vars.SITE_URL == ''
        run: |
          echo "::error::vars.SITE_URL tanımlı değil. Bu değer olmadan web imajı" \
               "placeholder alan adıyla (https://alp-pcb-toolkit.example) derlenir" \
               "ve dağıtılamaz. Depo ayarlarından tanımlayın:" \
               "Settings > Secrets and variables > Actions > Variables >" \
               "New repository variable, ad: SITE_URL, değer: https://<alan-adiniz>"
          exit 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          # Hem `latest` hem commit sha'sı basılır. Geri alma sha etiketiyle
          # yapılır: deploy/.env içinde IMAGE_TAG değiştirilip yığın yeniden
          # ayağa kaldırılır — yeniden derleme gerekmez.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          # Derleme bağlamı depo kökü: her iki Dockerfile da kökten yol verir
          # (web imajı deploy/nginx.conf'u da kopyalar).
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # api imajı bu ARG'ı tanımlamaz ve tüketmez; buildx yalnızca uyarı
          # basar. Tek matris adımını ikiye bölmek yerine burada geçilir.
          build-args: |
            VITE_SITE_URL=${{ vars.SITE_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Yayınlanan imaj bilinen açıklara karşı taranır. Yalnızca CRITICAL/HIGH
      # ve DÜZELTMESİ ÇIKMIŞ bulgular işi kırar: düzeltmesi olmayan bir taban
      # imaj CVE'si her push'u kırmızıya boyar ve tarama gürültüye dönüşürdü.
      #
      # Etiket `v` ÖNEKLİ olmalı: eylem önekli etiketlemeye geçti ve öneksiz
      # `0.28.0` artık çözülmüyor. Çözülemeyen bir eylem referansı işi ilk
      # adımda değil KURULUM aşamasında düşürür — yani yukarıdaki push hiç
      # koşmaz. Bu yüzden imaj yayını 31 Temmuz'dan beri sessizce durmuştu.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
