<!doctype html>
<!--
  lang="tr" varsayılan dildir (src/lib/i18n.js → DEFAULT_LANG). Kullanıcı dili
  değiştirdiğinde LangProvider (src/hooks/useLang.jsx) bu özniteliği günceller;
  `text-transform: uppercase` sayfanın dilini kullandığı için bu şarttır —
  lang="tr" altında "i" harfi "İ" olur ve İngilizce metin "VİA" diye çıkar.
  Başlık marka adıdır, çevrilmez.
-->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070c08" />
    <!-- Varsayılan site dili Türkçe (i18n.js DEFAULT_LANG) — statik meta tek
         dilli kalır; sekme başlığı ise rota ve dille birlikte değişir
         (App.jsx → TitleSync). -->
    <meta
      name="description"
      content="PCB tasarımı için çevrim içi donanım mühendisliği hesap araçları: yol genişliği, empedans, via, stack-up, DFM ve dönüştürücüler."
    />
    <title>ALP PCB Toolkit</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
