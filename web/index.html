<!doctype html>
<!--
  lang="tr" varsayılan dildir (src/lib/i18n.js → DEFAULT_LANG). Kullanıcı dili
  değiştirdiğinde LangProvider (src/hooks/useLang.jsx) bu özniteliği günceller;
  `text-transform: uppercase` sayfanın dilini kullandığı için bu şarttır —
  lang="tr" altında "i" harfi "İ" olur ve İngilizce metin "VİA" diye çıkar.
  Başlık marka adıdır, çevrilmez.
-->
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070c08" />
    <title>ALP PCB Toolkit</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
